<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071526">
  <title>{{ model.title or 'Διαδραστικό στερεό' }}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06111f;
      --panel: rgba(10, 28, 49, .78);
      --panel-strong: rgba(12, 34, 59, .94);
      --line: rgba(148, 189, 231, .2);
      --text: #f4f9ff;
      --muted: #a9bdd3;
      --blue: #4dabf7;
      --cyan: #5ce1e6;
      --gold: #ffd166;
      --focus: #9be7ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 20%, #123b61 0, var(--bg) 56%, #030a12 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .shell { position: relative; width: 100%; height: 100%; isolation: isolate; }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    #stage { position: absolute; inset: 0; touch-action: none; cursor: grab; outline: none; }
    #stage:active { cursor: grabbing; }
    #stage:focus-visible { box-shadow: inset 0 0 0 3px var(--focus); }
    .topbar {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }
    .identity, .actions, .dimensions, .hint {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
    }
    .identity { max-width: min(620px, 70vw); padding: 14px 17px; border-radius: 17px; }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(18px, 2.6vw, 30px); line-height: 1.2; letter-spacing: -.02em; }
    .actions { display: flex; gap: 8px; padding: 7px; border-radius: 16px; pointer-events: auto; }
    .control {
      display: inline-flex;
      min-width: 46px;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
    }
    .control:hover { background: rgba(92, 225, 230, .1); border-color: rgba(92, 225, 230, .25); }
    .control:active { transform: scale(.96); }
    .control:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .control svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .bottom {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }
    .dimensions { max-width: min(680px, 72vw); padding: 12px; border-radius: 17px; }
    .dimension-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .dimension-list li {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid rgba(77, 171, 247, .23);
      border-radius: 10px;
      background: rgba(77, 171, 247, .08);
      color: var(--muted);
      font-size: 14px;
    }
    .dimension-list strong { color: var(--text); font-weight: 750; font-variant-numeric: tabular-nums; }
    .hint {
      max-width: 290px;
      padding: 11px 14px;
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: right;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      z-index: 5;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .loading.is-hidden { opacity: 0; visibility: hidden; }
    .loader-ring { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
    .error { display: none; max-width: 520px; margin: 20vh auto; padding: 24px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 760px) {
      .topbar { top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; }
      .identity { max-width: calc(100vw - 142px); padding: 11px 13px; border-radius: 14px; }
      .eyebrow { font-size: 10px; }
      h1 { font-size: 17px; }
      .actions { padding: 5px; }
      .control { min-width: 44px; min-height: 44px; padding: 0 10px; }
      .control span { display: none; }
      .bottom { left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); display: block; }
      .dimensions { max-width: 100%; padding: 8px; }
      .dimension-list { gap: 6px; }
      .dimension-list li { min-height: 34px; padding: 6px 9px; font-size: 12px; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
  <script type="importmap">
    {"imports":{"three":"{{ url_for('static', filename='vendor/three/three.module.min.js') }}"}}
  </script>
</head>
<body>
  <main class="shell">
    <canvas id="stage" tabindex="0" aria-label="Περιστρεφόμενο τρισδιάστατο γεωμετρικό στερεό"></canvas>

    <header class="topbar">
      <section class="identity">
        <p class="eyebrow">Διαδραστικό μοντέλο 3D</p>
        <h1 id="model-title">{{ model.title or 'Στερεό γεωμετρικό σχήμα' }}</h1>
      </section>
      <nav class="actions" aria-label="Χειριστήρια μοντέλου">
        <button class="control" id="rotate-button" type="button" aria-pressed="true" aria-label="Παύση αυτόματης περιστροφής">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
          <span>Παύση</span>
        </button>
        <button class="control" id="reset-button" type="button" aria-label="Επαναφορά προβολής">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Επαναφορά</span>
        </button>
        <button class="control" id="fullscreen-button" type="button" aria-label="Πλήρης οθόνη">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
      </nav>
    </header>

    <footer class="bottom">
      <section class="dimensions" aria-label="Διαστάσεις">
        <ul class="dimension-list" id="dimension-list"></ul>
      </section>
      <p class="hint">Σύρετε για περιστροφή · Χρησιμοποιήστε δύο δάχτυλα ή τον τροχό για μεγέθυνση</p>
    </footer>

    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="loader-ring" aria-label="Φόρτωση μοντέλου"></div>
    </div>
    <section class="error" id="error" role="alert">
      <h2>Δεν ήταν δυνατή η εμφάνιση του μοντέλου</h2>
      <p>Η συσκευή ή το πρόγραμμα περιήγησης δεν υποστηρίζει WebGL.</p>
    </section>
  </main>

  <script id="model-data" type="application/json">{{ model | tojson }}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from '{{ url_for('static', filename='vendor/three/OrbitControls.js') }}';

    const config = JSON.parse(document.getElementById('model-data').textContent);
    const canvas = document.getElementById('stage');
    const loading = document.getElementById('loading');
    const errorPanel = document.getElementById('error');
    const dimensionsList = document.getElementById('dimension-list');
    const rotateButton = document.getElementById('rotate-button');
    const resetButton = document.getElementById('reset-button');
    const fullscreenButton = document.getElementById('fullscreen-button');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const defaults = {
      cylinder: { radius: 2, height: 5 },
      cone: { radius: 2, height: 5 },
      pyramid: { base_width: 4, base_depth: 4, height: 5 },
      square_pyramid: { base_width: 4, base_depth: 4, height: 5 },
      prism: { width: 4, depth: 2, height: 3 },
      cube: { side: 3 },
      sphere: { radius: 2.5 }
    };
    const shape = config.shape === 'pyramid' ? 'pyramid' : config.shape;
    const values = { ...(defaults[shape] || defaults.cube), ...(config.dimensions || {}) };
    const shapeNames = {
      cylinder: 'Κύλινδρος', cone: 'Κώνος', sphere: 'Σφαίρα',
      cube: 'Κύβος', prism: 'Ορθογώνιο παραλληλεπίπεδο',
      pyramid: 'Πυραμίδα', square_pyramid: 'Τετραγωνική πυραμίδα'
    };
    if (!config.title) document.getElementById('model-title').textContent = shapeNames[shape] || 'Στερεό γεωμετρικό σχήμα';

    const dimensionNames = {
      radius: 'Ακτίνα r', height: 'Ύψος h', side: 'Πλευρά a',
      width: 'Μήκος a', depth: 'Πλάτος b',
      base_width: 'Βάση a', base_depth: 'Βάση b'
    };
    for (const [key, value] of Object.entries(values)) {
      const item = document.createElement('li');
      const label = document.createElement('span');
      const number = document.createElement('strong');
      label.textContent = dimensionNames[key] || key;
      number.textContent = Number(value).toLocaleString('el-GR');
      item.append(label, number);
      dimensionsList.append(item);
    }

    try {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x071526, 0.025);
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 20000);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.enablePan = false;
      controls.autoRotateSpeed = 1.3;

      scene.add(new THREE.HemisphereLight(0xc9e7ff, 0x10233a, 2.25));
      const keyLight = new THREE.DirectionalLight(0xffffff, 3.4);
      keyLight.position.set(5, 8, 7);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      scene.add(keyLight);
      const rimLight = new THREE.DirectionalLight(0x54d9ff, 2.4);
      rimLight.position.set(-6, 3, -5);
      scene.add(rimLight);

      let geometry;
      if (shape === 'cylinder') {
        geometry = new THREE.CylinderGeometry(values.radius, values.radius, values.height, 64, 2, false);
      } else if (shape === 'cone') {
        geometry = new THREE.ConeGeometry(values.radius, values.height, 64, 3, false);
      } else if (shape === 'sphere') {
        geometry = new THREE.SphereGeometry(values.radius, 64, 40);
      } else if (shape === 'cube') {
        geometry = new THREE.BoxGeometry(values.side, values.side, values.side, 2, 2, 2);
      } else if (shape === 'prism') {
        geometry = new THREE.BoxGeometry(values.width, values.height, values.depth, 2, 2, 2);
      } else if (shape === 'pyramid' || shape === 'square_pyramid') {
        const w = values.base_width;
        const d = values.base_depth;
        const h = values.height;
        const points = new Float32Array([
          -w/2, -h/2, -d/2,  w/2, -h/2, -d/2,
           w/2, -h/2,  d/2, -w/2, -h/2,  d/2,
           0,    h/2,   0
        ]);
        const indices = [0,2,1, 0,3,2, 0,1,4, 1,2,4, 2,3,4, 3,0,4];
        geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(points, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
      } else {
        throw new Error('Unsupported solid');
      }

      geometry.computeBoundingBox();
      geometry.center();
      geometry.computeBoundingSphere();
      const radius = Math.max(geometry.boundingSphere.radius, .1);

      const group = new THREE.Group();
      const material = new THREE.MeshPhysicalMaterial({
        color: 0x278ee8,
        emissive: 0x061b33,
        metalness: .08,
        roughness: .22,
        clearcoat: 1,
        clearcoatRoughness: .16,
        transparent: true,
        opacity: .9,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry, 22),
        new THREE.LineBasicMaterial({ color: 0xa8e8ff, transparent: true, opacity: .9 })
      );
      group.add(edges);
      scene.add(group);

      const floorY = geometry.boundingBox.min.y - radius * .16;
      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(radius * 2.1, 72),
        new THREE.ShadowMaterial({ color: 0x000000, opacity: .3 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = floorY;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(radius * 4.2, 14, 0x397ba8, 0x1b4260);
      grid.position.y = floorY + .002;
      grid.material.transparent = true;
      grid.material.opacity = .28;
      scene.add(grid);

      const cameraDirection = new THREE.Vector3(2.3, 1.55, 2.7).normalize();
      const preferredDistance = () => radius * (camera.aspect < .7 ? 5.35 : 3.85);
      const initialCamera = cameraDirection.clone().multiplyScalar(preferredDistance());
      camera.position.copy(initialCamera);
      camera.near = Math.max(radius / 100, .01);
      camera.far = radius * 40;
      camera.updateProjectionMatrix();
      controls.minDistance = radius * 1.35;
      controls.maxDistance = radius * 8;
      controls.target.set(0, 0, 0);
      controls.update();
      setRotationState(true);

      function setRotationState(enabled) {
        controls.autoRotate = enabled && !reducedMotion.matches;
        rotateButton.setAttribute('aria-pressed', String(controls.autoRotate));
        rotateButton.setAttribute('aria-label', controls.autoRotate ? 'Παύση αυτόματης περιστροφής' : 'Έναρξη αυτόματης περιστροφής');
        rotateButton.querySelector('span').textContent = controls.autoRotate ? 'Παύση' : 'Περιστροφή';
      }
      rotateButton.addEventListener('click', () => setRotationState(!controls.autoRotate));
      resetButton.addEventListener('click', () => {
        group.rotation.set(0, 0, 0);
        camera.position.copy(initialCamera);
        controls.target.set(0, 0, 0);
        controls.update();
      });
      fullscreenButton.addEventListener('click', async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
        else await document.exitFullscreen?.();
      });
      reducedMotion.addEventListener('change', event => {
        if (event.matches) setRotationState(false);
      });
      canvas.addEventListener('keydown', event => {
        const step = Math.PI / 36;
        if (event.key === 'ArrowLeft') group.rotation.y -= step;
        else if (event.key === 'ArrowRight') group.rotation.y += step;
        else if (event.key === 'ArrowUp') group.rotation.x -= step;
        else if (event.key === 'ArrowDown') group.rotation.x += step;
        else return;
        event.preventDefault();
        setRotationState(false);
      });

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        camera.aspect = width / height;
        camera.position.setLength(preferredDistance());
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }
      window.addEventListener('resize', resize, { passive: true });

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
      loading.classList.add('is-hidden');
      window.__ELENI_VIEWER_READY__ = true;
    } catch (error) {
      console.error(error);
      loading.classList.add('is-hidden');
      errorPanel.style.display = 'block';
      canvas.style.display = 'none';
      window.__ELENI_VIEWER_ERROR__ = String(error);
    }
  </script>
</body>
</html>
